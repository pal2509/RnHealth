# Set the user and group that the server will run as
user nginx;
worker_processes auto;

# Set the error log file location
error_log /var/log/nginx/error.log;

# Set the pid file location
pid /run/nginx.pid;

# Configure the events section
events {
    # Set the maximum number of connections
    worker_connections 1024;
}

# Configure the http section
http {
    # Set the MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Set the log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Set the access log file location
    access_log /var/log/nginx/access.log main;

    # Set the server section
    server {
        # Set the listening IP and port
        listen 80;

        # Set the server name
        server_name rnhealth.com;

        # Set the location section
        location / {
            # Set the root directory
            root /usr/share/nginx/html;

            # Set the index file
            index index.html;

            try_files $uri $uri/ /index.html;
        }
        location /api/ {
            proxy_pass http://localhost:8000/;
        }

    }
}