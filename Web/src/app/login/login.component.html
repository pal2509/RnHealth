<mat-card class="loginCard">
  <mat-card-title class="cardTitle">Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" *ngIf="!loading">
    <mat-form-field appearance="outline" class="inputField">
      <mat-label>Email</mat-label>
      <input type="email" matInput [formControl]="emailFormControl" [errorStateMatcher]="matcher"
        placeholder="Ex. pat@example.com" [(ngModel)]="this.email" formControlName="email">
      <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
        Por favor insira um endereço de email válido
      </mat-error>
      <mat-error *ngIf="emailFormControl.hasError('required')">
        O email é <strong>obrigatório</strong>
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="inputField">
      <mat-label>Palavra-passe</mat-label>
      <input matInput type="password" [(ngModel)]="this.password" formControlName="password">
    </mat-form-field>
    <div class="loginBtn">
      <button class="btn" mat-raised-button color="primary" (click)="loginClick()" [disabled]="!form.valid">Entrar</button>
    </div>
  </form>
  <div style="display: flex; justify-content: center;">
    <mat-spinner *ngIf="loading" class="spinnerCont"></mat-spinner>
  </div>

  <div *ngIf="errorShow" style="color:red"><h4>Email ou palavra-passe errados!</h4></div>
  </mat-card-content>
</mat-card>
