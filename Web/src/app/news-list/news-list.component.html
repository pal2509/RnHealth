                <div class="table">
                    <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)" #myTable>


                        <ng-container matColumnDef="created_At">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header="created_At"> Data </th>
                            <td mat-cell *matCellDef="let element"> {{element.created_At | date: "dd-MM-yyyy" }} </td>
                        </ng-container>


                        <ng-container matColumnDef="title">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header="title"> Título </th>
                            <td mat-cell *matCellDef="let element"> {{element.title}} </td>
                        </ng-container>


                        <ng-container matColumnDef="mainText">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header="mainText"> Texto principal </th>
                            <td mat-cell *matCellDef="let element"> {{element.mainText}} </td>
                        </ng-container>

                

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectNew(row)">
                        </tr>

                        <!-- <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
                        </tr> -->
                    </table>

                    <mat-paginator [length]="dataLength" [pageSize]="10" #myPaginator>
                    </mat-paginator>
                </div>
            </mat-card-content>

        </mat-card>

    </div>
