<mat-card class="emailCard">
    <mat-card-title class="cardTitle">Insira o seu email para obter as suas leituras</mat-card-title>
    <mat-card-content>
      <form [formGroup]="form">
      <mat-form-field appearance="outline" class="inputField">
        <mat-label>Email</mat-label>
        <input type="email" matInput [formControl]="emailFormControl" [errorStateMatcher]="matcher"
          placeholder="Ex. pat@example.com" [(ngModel)]="this.email" formControlName="email">
        <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
          Por favor insira um endereço de email válido
        </mat-error>
        <mat-error *ngIf="emailFormControl.hasError('required')">
          O email é <strong>obrigatório</strong>
        </mat-error>
      </mat-form-field>
      <div class="setBtn">
        <button class="btn" mat-raised-button color="primary" (click)="searchClick()" [disabled]="!form.valid">Pesquisar</button>
      </div>
    </form>
    </mat-card-content>
  </mat-card>
