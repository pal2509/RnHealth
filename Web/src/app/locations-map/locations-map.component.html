<mat-card class="cardContainer">
  <div class="mapContainer">
    <div id="ol-map" class="ol-map"></div>
  </div>
  <div class="avaliation">
    <!-- <app-avaliation [avaliation]="this.selectedAvaliation" *ngIf="this.selectedAvaliation"></app-avaliation> -->
    <div class="table">
      <table mat-table [dataSource]="dataSource" matSort (matSortChange)="announceSortChange($event)">


        <ng-container matColumnDef="created_At">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="created_At"> Data </th>
          <td mat-cell *matCellDef="let element"> {{element.created_At | date: "dd-MM-yyyy" }} </td>
        </ng-container>


        <ng-container matColumnDef="reading">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="reading"> Leitura </th>
          <td mat-cell *matCellDef="let element"> {{element.reading[0].value}} </td>
        </ng-container>


        <ng-container matColumnDef="classification">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="classification"> Avaliação </th>
          <td mat-cell *matCellDef="let element" [ngStyle]="{color: getClassificationText(element.classification)[1]}"> {{getClassificationText(element.classification)[0]}} </td>
        </ng-container>

        <ng-container matColumnDef="location.city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="location.city"> Freguesia </th>
          <td mat-cell *matCellDef="let element"> {{element.location.city}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="email"> Email </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectAvaliation(row)" [ngClass]="{'makeSelected': row.id == this.selectedAvaliation?.id }"></tr>

        <!-- <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td> -->
        <!-- </tr> -->
      </table>

      <mat-paginator [length]="dataLength"
                     [pageSize]="10"
                     #myPaginator
                      >
      </mat-paginator>
    </div>
  </div>
  <app-avaliation [avaliation]="this.selectedAvaliation" *ngIf="this.selectedAvaliation"></app-avaliation>
</mat-card>
