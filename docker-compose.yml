services:
  backend:
    build:
      context: ./RnAPI
    env_file: .env
    depends_on:
      - rnmongo
    ports:
      - '50002:80'
    restart: unless-stopped
    networks:
      - rnhealth
  frontend:
    build:
      context: ./Web
    ports:
      - '50003:80'
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - rnhealth
  rnmongo:
    build:
      context: ./RnHealthDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set it in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set it in .env}
    volumes:
      - mongodbdata:/data/db
    restart: unless-stopped
    networks:
      - rnhealth
volumes:
  mongodbdata:
networks:
  rnhealth:
